# DeepFoul default config. Paths are relative to the repo root.

paths:
  raw: data/raw            # full downloaded videos (<fight_id>.mp4)
  clips: data/clips
  keypoints: data/keypoints
  cache: data/cache
  outputs: outputs
  labels: labels

# Device: auto | cuda | cpu. "auto" uses CUDA when onnxruntime-gpu and an NVIDIA GPU are available.
device: auto

# Machine profile, picked from detected VRAM (override with `profile: large|small|cpu`).
profile: auto
profiles:
  large:   # RTX 4090 (24 GB)
    min_vram_gb: 16
    pose_mode: performance   # rtmlib: RTMW-x 384x288 + YOLOX-m
    batch_size: 16
  small:   # RTX 2080 (8 GB)
    min_vram_gb: 6
    pose_mode: performance
    batch_size: 4
  cpu:     # Mac / no GPU: quick tests on short clips only
    min_vram_gb: 0
    pose_mode: lightweight   # rtmlib: RTMW-l 256x192 + YOLOX-tiny
    batch_size: 1

# Placeholders, tuned in later sections.
lookahead_s: 2.0          # max future context for any decision at time t
match_tolerance_s: 1.0    # eval: predicted flag matches a label within +-1 s
kpt_conf_min: 0.3         # keypoints below this are masked

fetch:
  max_height: 1080

# Shot (camera-cut) detection, 1.1. Changing these makes `extract --shots` re-run cached fights.
shots:
  detector: adaptive        # PySceneDetect AdaptiveDetector
  # Tuned in 1.1 (PySceneDetect defaults are 3.0 / 15). A lower ratio catches cuts in noisy
  # re-uploads (Battle-Loosa); a higher absolute floor rejects duplicate-frame and
  # compression-pulse fakes (Garbrandt-Long, Battle-Loosa). See PROGRESS.md 1.1.
  adaptive_threshold: 2.0   # score ratio vs rolling average needed for a cut
  min_content_val: 30.0     # minimum raw content change for a cut
  min_scene_len_s: 0.5      # converted to frames with each video's own fps
  content_threshold: 27.0   # used when detector: content
  per_fight: {}             # fight_id: {key: value} overrides for a bad video

previews:
  golden_pad_s: 10          # golden candidate clips: live time +- this many seconds

# Person detection, 1.2. rtmlib YOLOX of the profile's pose_mode (NMS is inside the model).
det:
  score_min: 0.1            # keep low-score boxes: ByteTrack's second pass uses them

# Tracking, 1.2. ByteTrack within each shot; reset at every cut.
tracking:
  cut_guard_frames: 1       # frames cut-1 and cut are not fed to the tracker (blended frames)
  bytetrack:                # trackers.ByteTrackTracker args (frame_rate comes from the video)
    lost_track_buffer: 30   # in 30 fps frames
    track_activation_threshold: 0.5
    minimum_consecutive_frames: 2
    minimum_iou_threshold: 0.1
    high_conf_det_threshold: 0.5
  # Loose on purpose: picking fighters and the ref is 1.3's job.
  filters:
    min_height_frac: 0.10       # box shorter than this fraction of the frame -> small
    rel_min_height_frac: 0.4    # shorter than this x the tallest confident box -> rel_small
    ref_score_min: 0.5          # boxes that count as "confident" for rel_small
    min_bottom_frac: 0.35       # box bottom above this fraction of the frame -> high (crowd)
    border_margin_frac: 0.01    # touching the left/right edge ...
    edge_max_height_frac: 0.25  # ... and shorter than this -> edge (partial crew)
    max_people: 6               # keep at most this many tallest boxes
  # Extra 30 s checks on non-golden train fights; thresholds must hold here too (no renders).
  checks:
    - {check_id: check_01, fight_id: ufc276_munhoz_omalley, start_s: 250, end_s: 280}
    - {check_id: check_02, fight_id: ufc321_jandiroba_dern, start_s: 150, end_s: 180}
    - {check_id: check_03, fight_id: ufc321_jandiroba_dern, start_s: 520, end_s: 550}

# Identity, 1.3. Shorts color names used in fights.csv red_shorts / blue_shorts, as OpenCV HSV
# ranges (H 0-179, S and V 0-255). A name may carry accents after "+" (e.g. "black+gold"); only
# the first name is the main color. Several ranges per name are OR-ed (red wraps around H=0).
identity:
  colors:
    black:  [[0, 0, 0, 179, 255, 49], [0, 0, 0, 179, 49, 70]]   # V < v_min, or dark and grey
    white:  [[0, 0, 150, 179, 49, 255]]
    gray:   [[0, 0, 71, 179, 49, 149]]
    red:    [[0, 90, 60, 8, 255, 255], [170, 90, 60, 179, 255, 255]]
    orange: [[9, 100, 80, 20, 255, 255]]
    gold:   [[18, 60, 60, 30, 255, 255]]
    yellow: [[22, 100, 120, 34, 255, 255]]
    green:  [[35, 50, 40, 85, 255, 255]]
    blue:   [[95, 80, 80, 125, 255, 255]]
    navy:   [[100, 60, 20, 130, 255, 110]]
    purple: [[126, 50, 40, 155, 255, 255]]
    pink:   [[150, 40, 120, 172, 255, 255]]
    brown:  [[5, 60, 30, 20, 255, 140]]
  # Pairs flagged as "similar" in the shorts report (besides identical main colors).
  similar_pairs: [[black, navy], [black, gray], [navy, blue], [red, orange], [red, pink],
                  [orange, gold], [gold, yellow], [purple, pink], [white, gray], [brown, black]]
  # Histograms: pixels with S < sat_min or V < v_min go to the achromatic (value) bins.
  sat_min: 50
  v_min: 50
  # Regions (fractions of torso length / of the hip->knee segment), see perception/appearance.py.
  regions:
    shorts_depth: 0.35        # hip -> this far toward the knee
    shorts_width: 0.30        # stroke width, x torso length
    thigh_from: 0.55          # lower thigh: from here to 0.9 of hip -> knee
    limb_width: 0.14
    min_pixels: 40            # fewer visible pixels -> region unknown
    min_skin_pixels: 20
    skin_ab_tol: 12.0         # Lab chroma distance from the face skin that still counts as skin
    skin_l_tol: 70.0
  profile:
    seed_s: 60                # learn profiles from the first seed_s of the fight window
    sample_every_s: 0.5
    seed_margin: 0.15         # seed-color share red vs blue needed to trust a frame
    refined_margin: 0.15      # same, with the refined profiles (second round)
    min_score: 0.2
    max_iou: 0.1              # the two fighters' boxes must not overlap in a teaching frame
    min_samples: 10           # fewer teaching frames -> keep the color-name seeds
    fighter_clothed_max: 0.8
    ref_clothed_min: 0.85
    min_rel_height: 0.45      # teaching boxes must be at least this x the tallest box in the frame
    drift_min: 0.25           # warn if a refined profile keeps less than this in its named color
  assign:
    fighter_max_cost: 0.75    # 1 - shorts (and torso) similarity, + clothed-shins penalty
    cue_weight_floor: 0.25    # shorts / torso weight = floor + gain x (1 - similarity of the
    cue_weight_gain: 0.75     #   two fighters on that cue), so the more distinct cue leads
    ref_max_cost: 0.45
    fallback_ref_max_cost: 0.7
    none_cost: 0.7            # flat cost of leaving a box unlabelled
    clothed_free: 0.7         # clothed score a fighter can have for free (shadows, dark skin, tape)
    fighter_clothed_penalty: 1.0
    ref_torso_penalty: 1.0    # fighter cost += this x (torso sim to ref shirt - sim to fighter torso)
    ref_clothed_weight: 0.6
    ref_profile_weight: 0.4
    fighter_min_rel_height: 0.35  # red/blue boxes shorter than this x the tallest box -> none
    merge_aspect_min: 0.45    # box width / height for a merged clinch box
    merge_contain_min: 0.7    # the other fighter's box this much inside the wide box = a fragment
    merge_memory_s: 0.5       # the other fighter's last box must be this recent ...
    merge_iou_min: 0.2        # ... and overlap the wide box this much
  smooth:
    smooth_s: 0.5             # majority vote within a tracklet over t +- smooth_s
    split_frames: 8           # a new label holding this long splits the tracklet (ID swap)

pose:
  batch: true                 # one ONNX call per frame when the model allows it

# Ari's 1.2 tracking issues (original-video seconds), re-checked in the 1.3 identity report.
identity_issue_checks:
  - {n: 2, clip: golden_01, t: 492, note: "ref walks in front of Battle; Battle's ID went to the ref"}
  - {n: 3, clip: golden_02, t: 298, note: "Holland and ref swapped IDs at a cut"}
  - {n: 4, clip: golden_03, t: 533, note: "Vera and O'Malley swapped mid-shot"}
  - {n: 4, clip: golden_03, t: 549, note: "the swap back at 09:09"}
  - {n: 5, clip: golden_04, t: 843, note: "clinch after the angle change, one merged box"}
  - {n: 6, clip: golden_04, t: 848, note: "crowd through the fence, Barber/Grasso swaps, ref swaps with Grasso"}
  - {n: 7, clip: golden_05, t: 672, note: "ref walks behind Shara, new ID"}
  - {n: 8, clip: golden_06, t: 521, note: "angle change, fighters and ref cycle IDs"}
  - {n: 8, clip: golden_06, t: 528, note: "angle change, IDs fixed again"}
